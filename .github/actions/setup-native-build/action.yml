name: Set up native build cache
description: Validate the Android NDK and restore a component-specific C/C++ compiler cache.
inputs:
  component:
    description: Cache namespace for the native component.
    required: true
runs:
  using: composite
  steps:
    - name: Set up ccache
      id: toolchain
      shell: bash
      run: |
        set -euo pipefail
        test -f "$ANDROID_NDK_HOME/source.properties"
        test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
        if ! command -v ccache >/dev/null 2>&1; then
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ccache
        fi
        echo "ndk=$(sha256sum "$ANDROID_NDK_HOME/source.properties" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
        {
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          echo "CCACHE_COMPILERCHECK=content"
          echo "CCACHE_MAXSIZE=1G"
        } >> "$GITHUB_ENV"

    - name: Restore compiler cache
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/ccache
        key: native-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.component }}-${{ steps.toolchain.outputs.ndk }}-${{ github.sha }}
        restore-keys: |
          native-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.component }}-${{ steps.toolchain.outputs.ndk }}-

    - name: Reset cache statistics
      shell: bash
      run: ccache --zero-stats
