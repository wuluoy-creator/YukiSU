name: SUMH regression tests

on:
  push:
    branches: [main]
    paths:
      - 'kernel/sumh/**'
      - 'kernel/feature/selinux_hide.c'
      - 'uapi/feature.h'
      - 'scripts/ci/test_selinux_hide_status.py'
      - 'userspace/ksud/sumhp/**'
      - 'userspace/ksud/src/cli_args.cpp'
      - 'userspace/ksud/src/boot/boot_patch.cpp'
      - 'userspace/ksud/src/core/ksucalls.cpp'
      - 'userspace/ksud/src/init_event.cpp'
      - 'userspace/ksud/tests/sumh*'
      - 'userspace/ksud/tests/run_sumh_host_tests.py'
      - 'userspace/ksud/tests/run_sumhp_daemon_host_tests.py'
      - 'userspace/ksud/tests/mount_partition_alias_test.cpp'
      - 'userspace/ksud/tests/run_mount_alias_host_tests.py'
      - 'userspace/ksud/tests/magic_mount_lifecycle_test.cpp'
      - 'userspace/ksud/tests/magic_mount_traversal_test.cpp'
      - 'userspace/ksud/tests/run_magic_mount_host_tests.py'
      - 'userspace/ksud/tests/overlay_mount_test.cpp'
      - 'userspace/ksud/tests/overlay_layer_selection_test.cpp'
      - 'userspace/ksud/tests/run_overlay_mount_host_tests.py'
      - 'uapi/sumh.h'
      - 'scripts/ci/test_sumh*'
      - '.github/workflows/sumh-tests.yml'
  pull_request:
    paths:
      - 'kernel/sumh/**'
      - 'kernel/feature/selinux_hide.c'
      - 'uapi/feature.h'
      - 'scripts/ci/test_selinux_hide_status.py'
      - 'userspace/ksud/sumhp/**'
      - 'userspace/ksud/src/cli_args.cpp'
      - 'userspace/ksud/src/boot/boot_patch.cpp'
      - 'userspace/ksud/src/core/ksucalls.cpp'
      - 'userspace/ksud/src/init_event.cpp'
      - 'userspace/ksud/tests/sumh*'
      - 'userspace/ksud/tests/run_sumh_host_tests.py'
      - 'userspace/ksud/tests/run_sumhp_daemon_host_tests.py'
      - 'userspace/ksud/tests/mount_partition_alias_test.cpp'
      - 'userspace/ksud/tests/run_mount_alias_host_tests.py'
      - 'userspace/ksud/tests/magic_mount_lifecycle_test.cpp'
      - 'userspace/ksud/tests/magic_mount_traversal_test.cpp'
      - 'userspace/ksud/tests/run_magic_mount_host_tests.py'
      - 'userspace/ksud/tests/overlay_mount_test.cpp'
      - 'userspace/ksud/tests/overlay_layer_selection_test.cpp'
      - 'userspace/ksud/tests/run_overlay_mount_host_tests.py'
      - 'uapi/sumh.h'
      - 'scripts/ci/test_sumh*'
      - '.github/workflows/sumh-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Kernel ownership, VFS helpers and build spoofing
        run: |
          python3 scripts/ci/test_sumh_core.py --cc clang
          python3 scripts/ci/test_sumh_vfs_helpers.py --cc clang
          python3 scripts/ci/test_sumh_mount_views.py --cc clang
          python3 scripts/ci/test_sumh_native_namespace.py --cc clang
          python3 scripts/ci/test_selinux_hide_status.py --cc clang
          python3 scripts/ci/test_sumh_guards.py --cc clang
          python3 scripts/ci/test_sumh_kernel_build.py --cc clang
          python3 scripts/ci/test_sumh_rules.py --cc clang
      - name: Userspace client, configuration, CLI and restoration
        run: python3 userspace/ksud/tests/run_sumh_host_tests.py --cxx g++
      - name: Daemon framing, deadlines and retry handling
        run: python3 userspace/ksud/tests/run_sumhp_daemon_host_tests.py --cxx g++
      - name: Module partition aliases and mount planning
        run: python3 userspace/ksud/tests/run_mount_alias_host_tests.py --cxx g++
      - name: Magic Mount lifecycle, registration and traversal
        run: python3 userspace/ksud/tests/run_magic_mount_host_tests.py --cxx g++
      - name: OverlayFS parent and child attribute registration
        run: python3 userspace/ksud/tests/run_overlay_mount_host_tests.py --cxx g++
