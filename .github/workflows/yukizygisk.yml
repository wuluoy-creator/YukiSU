name: Build YukiZygisk
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
        description: "Arm64 package target with ARM compat payloads"
      os:
        required: false
        type: string
        default: ubuntu-latest
  workflow_dispatch:
    inputs:
      target:
        required: false
        type: choice
        default: aarch64-linux-android
        options:
          - aarch64-linux-android
      os:
        required: false
        type: string
        default: ubuntu-latest

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ${{ inputs.os }}
    defaults:
      run:
        shell: bash
    env:
      BUILD_TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v7

      - name: Initialize payload dependencies
        run: |
          git submodule update --init --depth 1 --jobs "$(nproc)" \
            userspace/zygisk/third_party/lsplt \
            userspace/ksud/third_party/ndk-busybox

      - name: Set up native build cache
        uses: ./.github/actions/setup-native-build
        with:
          component: yukizygisk-${{ inputs.target }}

      - name: Determine target settings
        id: target
        run: |
          case "$BUILD_TARGET" in
            aarch64-linux-android|aarch64)
              echo "abi=arm64-v8a" >> "$GITHUB_OUTPUT"
              echo "android_target=aarch64-linux-android31" >> "$GITHUB_OUTPUT"
              echo "daemon_target=aarch64-linux-android31" >> "$GITHUB_OUTPUT"
              echo "abi32=armeabi-v7a" >> "$GITHUB_OUTPUT"
              echo "android_target32=armv7a-linux-androideabi31" >> "$GITHUB_OUTPUT"
              echo "daemon_target32=armv7a-linux-androideabi31" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "YukiZygisk workflow supports aarch64 only, got: $BUILD_TARGET"
              exit 1
              ;;
          esac

      - name: Build YukiZygisk payload
        run: |
          set -euo pipefail
          core_dir="$PWD/userspace/zygisk/core"
          daemon_dir="$PWD/userspace/zygisk/daemon"
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          export STRIP="$TOOLCHAIN/bin/llvm-strip"
          # Build both ABIs concurrently without oversubscribing the runner.
          parallel_jobs=$(( $(nproc) / 2 ))
          if [ "$parallel_jobs" -lt 1 ]; then parallel_jobs=1; fi

          build_payload() {
            local source_dir="$1"
            local abi="$2"
            local android_target="$3"
            local build_dir="$4"
            export CC="$TOOLCHAIN/bin/${android_target}-clang"
            export CXX="$TOOLCHAIN/bin/${android_target}-clang++"
            cmake -S "$source_dir" -B "$build_dir" \
              -G Ninja \
              -DCMAKE_SYSTEM_NAME=Android \
              -DCMAKE_ANDROID_ARCH_ABI="$abi" \
              -DCMAKE_ANDROID_NDK="$ANDROID_NDK_HOME" \
              -DCMAKE_SYSTEM_VERSION=31 \
              -DCMAKE_C_COMPILER="$CC" \
              -DCMAKE_CXX_COMPILER="$CXX" \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_BUILD_TYPE=Release \
              -DYUKISU_ENABLE_CLANG_TIDY=OFF
            cmake --build "$build_dir" --parallel "$parallel_jobs"
          }

          (
            build_payload "$core_dir" "${{ steps.target.outputs.abi }}" \
              "${{ steps.target.outputs.android_target }}" "$core_dir/build"
            build_payload "$daemon_dir" "${{ steps.target.outputs.abi }}" \
              "${{ steps.target.outputs.daemon_target }}" "$daemon_dir/build"
          ) &
          arm64_pid=$!
          (
            build_payload "$core_dir" "${{ steps.target.outputs.abi32 }}" \
              "${{ steps.target.outputs.android_target32 }}" "$core_dir/build-armv7"
            build_payload "$daemon_dir" "${{ steps.target.outputs.abi32 }}" \
              "${{ steps.target.outputs.daemon_target32 }}" "$daemon_dir/build-armv7"
          ) &
          arm32_pid=$!
          status=0
          wait "$arm64_pid" || status=1
          wait "$arm32_pid" || status=1
          if [ "$status" -ne 0 ]; then
            echo "::error::YukiZygisk payload build failed."
            exit "$status"
          fi

          dist="$core_dir/dist"
          rm -rf "$dist"
          mkdir -p "$dist"
          cp "$daemon_dir"/build/zygiskd64 \
            "$daemon_dir"/build-armv7/zygiskd32 \
            "$core_dir"/build/libzygisk64.so \
            "$core_dir"/build/libyukilinker64.so \
            "$core_dir"/build/libyukizncore64.so \
            "$core_dir"/build-armv7/libzygisk32.so \
            "$core_dir"/build-armv7/libyukilinker32.so \
            "$core_dir"/build-armv7/libyukizncore32.so "$dist/"
          for asset in zygiskd64 zygiskd32 \
            libzygisk64.so libzygisk32.so \
            libyukilinker64.so libyukilinker32.so \
            libyukizncore64.so libyukizncore32.so; do
            test -s "$dist/$asset"
          done
          ls -lh "$dist"/*
          file "$dist"/*

      - name: Show compiler cache statistics
        run: ccache --show-stats

      - name: Upload YukiZygisk artifact
        uses: actions/upload-artifact@v7
        with:
          name: yukizygisk-${{ inputs.target }}
          path: userspace/zygisk/core/dist/*
          if-no-files-found: error
